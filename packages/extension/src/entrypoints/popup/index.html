<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Debug MCP</title>
    <style>
      body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px; width: 320px; color: #1f2328; }
      h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #999; display: inline-block; }
      .dot.on { background: #2da44e; } .dot.off { background: #cf222e; }
      .muted { color: #656d76; }
      .ok { color: #1a7f37; }
      a.tabLink { color: #0969da; text-decoration: none; }
      a.tabLink:hover { text-decoration: underline; }
      button.small { padding: 1px 8px; font-size: 11px; }
      ul { list-style: none; padding: 0; margin: 8px 0; }
      li { padding: 6px 0; border-top: 1px solid #eee; }
      .caps span { display: inline-block; background: #ddf4ff; color: #0969da; border-radius: 10px; padding: 0 6px; margin-right: 4px; font-size: 11px; }
      button { font: inherit; padding: 4px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
      input { font: inherit; width: 100%; box-sizing: border-box; padding: 4px 6px; margin: 4px 0; }
      code { background: #f6f8fa; padding: 1px 4px; border-radius: 4px; }
      .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
      .row input[type="text"], .row input:not([type]) { flex: 1; margin: 0; }
    </style>
  </head>
  <body>
    <h1><span id="dot" class="dot"></span> Agent Debug MCP <span id="ver" class="muted"></span></h1>
    <div id="status" class="muted">Loading…</div>
    <div id="pending"></div>
    <div id="pair"></div>
    <div id="current"></div>
    <ul id="tabs"></ul>
    <div class="row">
      <button id="reconnect">Reconnect</button>
      <button id="unpair">Unpair</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
